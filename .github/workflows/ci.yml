name: CI

"on":
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: Tox (${{ matrix.tox-env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310-django52
          - python-version: "3.11"
            tox-env: py311-django52
          - python-version: "3.12"
            tox-env: py312-django52
          - python-version: "3.13"
            tox-env: py313-django52
          - python-version: "3.14"
            tox-env: py314-django52
          - python-version: "3.12"
            tox-env: py312-django60
          - python-version: "3.13"
            tox-env: py313-django60
          - python-version: "3.14"
            tox-env: py314-django60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: tox-${{ matrix.tox-env }}

      - name: Run tox
        run: uv run tox -e ${{ matrix.tox-env }}

  quality:
    name: Quality and docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: quality-py313

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format . --check

      - name: Run prek hooks
        run: uv run prek run --all-files

      - name: Build docs with warnings as errors
        run: uv run sphinx-build -W -b html docs docs/_build/html
