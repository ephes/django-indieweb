name: State transitions

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL state regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: indieweb_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
      - name: Check file-backed SQLite state transitions
        env:
          DJANGO_INDIEWEB_TEST_SQLITE_PATH: /tmp/indieweb-synthetic.sqlite3
        run: uv run pytest --migrations --no-cov tests/test_outbound_state.py
      - name: Check state transitions with migrations
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_postgres
        run: uv run pytest --migrations --no-cov tests/test_outbound_state.py
      - name: Check receive commits and freshness with PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_postgres
        run: >-
          uv run pytest --migrations --no-cov
          tests/test_receive_notifications.py tests/test_webmention_processor.py
          -k 'postcommit_notification or freshness_watermark or skips_stale_outcome'

      - name: Check nested batches and routed diagnostics with PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_postgres
        run: >-
          uv run pytest --migrations --no-cov
          tests/test_nested_response_queries.py tests/test_delivery_diagnostic_atomicity.py
          tests/test_token_management.py::test_revoke_locks_grant_on_collector_delete_path

      - name: Check exact Webmention counts and display with PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_postgres
        run: >-
          uv run pytest --migrations --no-cov
          tests/test_webmention_count_collations.py tests/test_webmention_display_queries.py
