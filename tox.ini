[tox]
envlist =
    py311-django52
    py312-django52
    py313-django52
    py314-django52
    py313-django52-migrations
    storage-sqlite
    py312-django60
    py313-django60
    py314-django60
    py312-django61
    py313-django61
    py314-django61
isolated_build = True

[testenv]
description = Run tests for the supported Python/Django matrix.
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
setenv = DJANGO_SETTINGS_MODULE=tests.settings
# Keep these test dependencies aligned with the pyproject.toml dev group.
# Tox installs them explicitly so each env can pin its intended Django series.
deps =
    django52: Django>=5.2.13,<5.3
    django60: Django>=6.0.4,<6.1
    django61: Django>=6.1,<6.2
    django-environ
    pytest>=9.0.3
    pytest-cov>=3
    pytest-django
commands =
    python -c "import django, sys; print(f'Python {sys.version.split()[0]}'); print(f'Django {django.get_version()}')"
    pytest

[testenv:py313-django52-migrations]
description = Run tests with Django migrations enabled.
commands =
    python -c "import django, sys; print(f'Python {sys.version.split()[0]}'); print(f'Django {django.get_version()}')"
    # Override pytest addopts from pyproject.toml so this env exercises real Django migrations without coverage.
    pytest --migrations --no-cov

[testenv:hooks]
description = Run configured prek hooks.
deps = prek
commands = prek run --all-files

[testenv:pre-commit]
description = Run configured prek hooks.
deps = {[testenv:hooks]deps}
commands = {[testenv:hooks]commands}

[testenv:storage-sqlite]
description = Required concurrency and issuance rollback tests with fresh file SQLite and migrations.
basepython = python3.13
deps =
    {[testenv]deps}
    Django>=5.2.13,<5.3
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    DJANGO_INDIEWEB_REQUIRE_STORAGE_TESTS=1
    DJANGO_INDIEWEB_TEST_SQLITE_PATH={env_tmp_dir}/storage.sqlite3
commands =
    pytest --migrations --create-db --no-cov tests/test_auth_contention.py tests/test_token_issuance_atomicity.py tests/test_outbound_state.py tests/test_receive_persistence_recovery.py

[testenv:storage-postgres]
description = Opt-in required storage regressions against disposable synthetic PostgreSQL.
basepython = python3.13
deps =
    {[testenv:storage-sqlite]deps}
    psycopg[binary]>=3.2
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings_postgres
    DJANGO_INDIEWEB_REQUIRE_STORAGE_TESTS=1
passenv = INDIEWEB_TEST_POSTGRES_PORT
commands = {[testenv:storage-sqlite]commands}
